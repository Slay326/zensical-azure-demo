<text x="100" y="32" class="coordinate">01</text><text x="300" y="32" class="coordinate">02</text><text x="500" y="32" class="coordinate">03</text><text x="700" y="32" class="coordinate">04</text><text x="900" y="32" class="coordinate">05</text><text x="1100" y="32" class="coordinate">06</text>
<text x="25" y="160" class="coordinate">A</text><text x="25" y="305" class="coordinate">B</text><text x="25" y="450" class="coordinate">C</text><text x="25" y="595" class="coordinate">D</text>
<rect x="40" y="45" width="1120" height="76" fill="#09131c"/>
<text x="60" y="72" class="stamp">IMPERIAL ENGINEERING DIRECTORATE / CONTROLLED DRAWING</text><text x="60" y="108" class="heading">HANGAR LOGISTICS / SEPARATED ROUTES</text>
<rect x="55" y="145" width="720" height="440" class="boundary"/><text x="75" y="173" class="stamp">Z4 / BAY ENVELOPE</text><g class="node "><rect x="85" y="210" width="240" height="76"/><text x="101" y="239" class="label" style="font-size:18px">APPROACH CONTROL</text><text x="101" y="265" class="small" style="font-size:11px">IF-06 · challenge / clearance</text></g><g class="node "><rect x="465" y="210" width="270" height="76"/><text x="481" y="239" class="label" style="font-size:18px">LANDING PADS</text><text x="481" y="265" class="small" style="font-size:12px">Craft secured; traffic separated</text></g><path d="M325 248H465" class="wire" marker-end="url(#arrow)"/><g class="node "><rect x="85" y="370" width="240" height="76"/><text x="101" y="399" class="label" style="font-size:18px">SERVICE GALLERY</text><text x="101" y="425" class="small" style="font-size:11px">Dead end / no through transit</text></g><path d="M465 268H375V408H325" class="wire" marker-end="url(#arrow)"/><g class="node "><rect x="465" y="370" width="270" height="76"/><text x="481" y="399" class="label" style="font-size:18px">CREW GALLERY</text><text x="481" y="425" class="small" style="font-size:13px">Outside flight envelope</text></g><path d="M600 286V370" class="signal" marker-end="url(#arrow)"/><g class="node "><rect x="850" y="370" width="280" height="76"/><text x="866" y="399" class="label" style="font-size:18px">BCP-4/3 → Z3</text><text x="866" y="425" class="small" style="font-size:13px">Personnel authorization</text></g><path d="M735 408H850" class="wire" marker-end="url(#arrow)"/><g class="node "><rect x="465" y="490" width="270" height="76"/><text x="481" y="519" class="label" style="font-size:18px">FREIGHT LIFT A / B</text><text x="481" y="545" class="small" style="font-size:12px">Cargo / manifest reconciliation</text></g><path d="M735 250H758V528H735" class="wire" marker-end="url(#arrow)"/><g class="node "><rect x="850" y="490" width="280" height="76"/><text x="866" y="519" class="label"