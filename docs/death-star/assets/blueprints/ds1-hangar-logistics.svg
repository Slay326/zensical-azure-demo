<text x="60" y="648" class="small">Solid = movement / handover. Dashed = personnel transfer after securing craft; not a direct pad walkway.</text><text x="60" y="689" class="stamp">DS1-DRG-104  /  REV 01  /  SCHEMATIC · NOT TO SCALE</text><text x="835" y="689" class="small">DS-1 / IMPERIAL RESTRICTED</text>
