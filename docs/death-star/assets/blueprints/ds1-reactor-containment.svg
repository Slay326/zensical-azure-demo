<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">DS1-DRG-108 — Reactor containment / system boundaries</title><desc id="desc">A single fictional reactor is enclosed by independent containment control. Two conversion halls provide redundancy downstream. Setpoints and telemetry cross separate diodes.</desc>
<defs><pattern id="fine" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#14222d" stroke-width=".5"/></pattern><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#fine)"/><path d="M50 0H0V50" fill="none" stroke="#223744" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a4c5d4" stroke-width="1.2"/></marker>
<style>text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#d5e5ec}.label{font-size:18px}.small{font-size:13px;fill:#96b2c1}.heading{font-size:27px;letter-spacing:1px}.stamp{font-size:14px;fill:#a4c5d4;letter-spacing:1px}.wire{fill:none;stroke:#a4c5d4;stroke-width:1.5}.signal{fill:none;stroke:#a4c5d4;stroke-width:1.4;stroke-dasharray:6 5}.boundary{fill:#0a141c;fill-opacity:.8;stroke:#597b8e;stroke-width:1.3;stroke-dasharray:7 5}.critical{fill:none;stroke:#d8976b;stroke-width:1.5}.node rect{fill:#101f2b;stroke:#799daf;stroke-width:1.2}.node.hot rect{stroke:#d8976b}.node.muted rect{stroke-dasharray:6 4}.coordinate{font-size:11px;fill:#6e8d9e}</style></defs>
