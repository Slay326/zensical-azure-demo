<text x="100" y="32" class="coordinate">01</text><text x="300" y="32" class="coordinate">02</text><text x="500" y="32" class="coordinate">03</text><text x="700" y="32" class="coordinate">04</text><text x="900" y="32" class="coordinate">05</text><text x="1100" y="32" class="coordinate">06</text>
<text x="25" y="160" class="coordinate">A</text><text x="25" y="305" class="coordinate">B</text><text x="25" y="450" class="coordinate">C</text><text x="25" y="595" class="coordinate">D</text>
<rect x="40" y="45" width="1120" height="76" fill="#09131c"/>
<text x="60" y="72" class="stamp">IMPERIAL ENGINEERING DIRECTORATE / CONTROLLED DRAWING</text><text x="60" y="108" class="heading">MAINTENANCE ACCESS / LAYERS OF EVIDENCE</text>
<g class="node "><rect x="60" y="160" width="320" height="76"/><text x="76" y="189" class="label" style="font-size:18px">01 / DECLARED WINDOW</text><text x="76" y="215" class="small" style="font-size:12px">Scope + abort time + concurrency check</text></g><g class="node "><rect x="60" y="300" width="320" height="76"/><text x="76" y="329" class="label" style="font-size:18px">02 / CONTROLLED ACCESS</text><text x="76" y="355" class="small" style="font-size:11px">Sector clearance + escort where required</text></g><g class="node "><rect x="60" y="440" width="320" height="76"/><text x="76" y="469" class="label" style="font-size:18px">03 / PROVED ISOLATION</text><text x="76" y="495" class="small" style="font-size:13px">At point of work; by the worker</text></g><path d="M220 236V300" class="wire" marker-end="url(#arrow)"/><path d="M220 376V440" class="wire" marker-end="url(#arrow)"/><rect x="520" y="160" width="610" height="400" class="boundary"/><text x="550" y="194" class="stamp">ISOLATED WORK ENVELOPE / LOCATION VERIFIED</text><text x="555" y="249" class="label">ELECTRICAL</text><path d="M835 243H865" class="wire"/><path d="M865 243L890 223" class="critical"/><path d="M900 243H1090" class="wire"/><text x="555" y="299" class="label">THERMAL / PRESSURE</text><path d="M835 293H865" class="wire"/><path d="M865 293L890 273" class="critical"/><path d="M900 293H1090" class="wire"/><text x="555" y="349" class="label">MECHANICAL</text><path d="M835 343H865" class="wire"/><path d="M865 343L890 323" class="critical"/><path d="M900 343H1090" class="wire"/><text x="555" y="399" class="label">CONTROL PATH</text><path d="M835 393H865" class="wire"/><path d="M865 393L890 373" class="critical"/><path d="M900 393H1090" class="wire"/><path d="M380 478H520" class="wire" marker-end="url(#arrow)"/><text x="550" y="497" class="stamp">LOCK / TAG → WORK → RESTORE → PROVE</text><text x="550" y="532" class="small">Both partners of a 2N pair must never be isolated.</text>
<path d="M40 620H1160M40 667H1160M815 667V702" class="wire"/>
<text x="60" y="648" class="small">Open contacts = isolated energy/control paths. The window closes on restoration evidence, not work completion.</text><text x="60" y="689" class="stamp">DS1-DRG-107  /  REV 01  /  SCHEMATIC · NOT TO SCALE</text><text x="835" y="689" class="small">DS-1 / IMPERIAL RESTRICTED</text>
