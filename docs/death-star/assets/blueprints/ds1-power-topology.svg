<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">DS1-DRG-103 — Power topology &amp; failure separation</title><desc id="desc">Conversion halls feed physically separated main trunks. A normally open tie preserves failure separation. Standby generation feeds the essential bus independently.</desc>
<defs><pattern id="fine" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#14222d" stroke-width=".5"/></pattern><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#fine)"/><path d="M50 0H0V50" fill="none" stroke="#223744" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a4c5d4" stroke-width="1.2"/></marker>
<style>text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#d5e5ec}.label{font-size:18px}.small{font-size:13px;fill:#96b2c1}.heading{font-size:27px;letter-spacing:1px}.stamp{font-size:14px;fill:#a4c5d4;letter-spacing:1px}.wire{fill:none;stroke:#a4c5d4;stroke-width:1.5}.signal{fill:none;stroke:#a4c5d4;stroke-width:1.4;stroke-dasharray:6 5}.boundary{fill:#0a141c;fill-opacity:.8;stroke:#597b8e;stroke-width:1.3;stroke-dasharray:7 5}.critical{fill:none;stroke:#d8976b;stroke-width:1.5}.node rect{fill:#101f2b;stroke:#799daf;stroke-width:1.2}.node.hot rect{stroke:#d8976b}.node.muted rect{stroke-dasharray:6 4}.coordinate{font-size:11px;fill:#6e8d9e}</style></defs>
<rect width="1200" height="720" fill="#09131c"/><rect x="18" y="18" width="1164" height="684" fill="url(#grid)" stroke="#466273"/>
<text x="100" y="32" class="coordinate">01</text><text x="300" y="32" class="coordinate">02</text><text x="500" y="32" class="coordinate">03</text><text x="700" y="32" class="coordinate">04</text><text x="900" y="32" class="coordinate">05</text><text x="1100" y="32" class="coordinate">06</text>
<text x="25" y="160" class="coordinate">A</text><text x="25" y="305" class="coordinate">B</text><text x="25" y="450" class="coordinate">C</text><text x="25" y="595" class="coordinate">D</text>
<rect x="40" y="45" width="1120" height="76" fill="#09131c"/>
<text x="60" y="72" class="stamp">IMPERIAL ENGINEERING DIRECTORATE / CONTROLLED DRAWING</text><text x="60" y="108" class="heading">POWER TOPOLOGY &amp; FAILURE SEPARATION</text>
<g class="node "><rect x="60" y="155" width="280" height="70"/><text x="74" y="183" class="label" style="font-size:16px">PCH-A / MTB-A</text><text x="74" y="206" class="small">Physically separate route A</text></g><g class="node "><rect x="450" y="155" width="280" height="70"/><text x="464" y="183" class="label" style="font-size:16px">PCH-B / MTB-B</text><text x="464" y="206" class="small">Physically separate route B</text></g><path d="M340 189H370M420 189H450M370 189L410 167" class="wire"/><text x="321" y="247" class="small">TIE NORMALLY OPEN</text><path d="M200 225V277H295V300" class="wire" marker-end="url(#arrow)"/><path d="M590 225V277H490V300" class="wire" marker-end="url(#arrow)"/><g class="node "><rect x="180" y="300" width="435" height="70"/><text x="194" y="328" class="label" style="font-size:16px">SUPPLY SELECTION / TRANSFER</text><text x="194" y="351" class="small">Source A OR B; never parallel the trunks</text></g><path d="M397 370V402H140V425M397 402H320V425M397 402H500V425M397 402H680V425" class="wire" marker-end="url(#arrow)"/><g class="node "><rect x="60" y="425" width="160" height="70"/><text x="74" y="453" class="label" style="font-size:16px">QRB-I</text><text x="74" y="476" class="small">Closed ring</text></g><path d="M140 495V525" class="wire" marker-end="url(#arrow)"/><g class="node "><rect x="240" y="425" width="160" height="70"/><text x="254" y="453" class="label" style="font-size:16px">QRB-II</text><text x="254" y="476" class="small">Closed ring</text></g><path d="M320 495V525" class="wire" marker-end="url(#arrow)"/><g class="node "><rect x="420" y="425" width="160" height="70"/><text x="434" y="453" class="label" style="font-size:16px">QRB-III</text><text x="434" y="476" class="small">Closed ring</text></g><path d="M500 495V525" class="wire" marker-end="url(#arrow)"/><g class="node "><rect x="600" y="425" width="160" height="70"/><text x="614" y="453" class="label" style="font-size:16px">QRB-IV</text><text x="614" y="476" class="small">Closed ring</text></g><path d="M680 495V525" class="wire" marker-end="url(#arrow)"/><path d="M140 525H680" class="signal"/><text x="140" y="559" class="label">SECTOR BOARDS ×72 / N+1 TARGET</text><text x="140" y="587" class="small">TD-11: six Q-II boards lack their N+1 partner.</text><g class="node "><rect x="850" y="155" width="290" height="70"/><text x="864" y="183" class="label" style="font-size:16px">STANDBY SG-1…8</text><text x="864" y="206" class="small">Independent of reactor</text></g><path d="M995 225V300" class="wire" marker-end="url(#arrow)"/><g class="node "><rect x="850" y="300" width="290" height="70"/><text x="864" y="328" class="label" style="font-size:16px">ESSENTIAL EB-A / B</text><text x="864" y="351" class="small">P0 loads; 2N essential bus</text></g><g class="node "><rect x="850" y="475" width="290" height="70"/><text x="864" y="503" class="label" style="font-size:16px">DEDICATED MTB FEEDS</text><text x="864" y="526" class="small">Propulsion / armament</text></g><text x="850" y="571" class="small">Dedicated feeds bypass QRBs.</text><text x="850" y="591" class="small">Interlocks remain in force.</text>
<path d="M40 620H1160M40 667H1160M815 667V702" class="wire"/>
<text x="60" y="648" class="small">Functional supply hierarchy, not a wiring schedule. Transfer selects a source; it does not close the bus tie.</text><text x="60" y="689" class="stamp">DS1-DRG-103  /  REV 01  /  SCHEMATIC · NOT TO SCALE</text><text x="835" y="689" class="small">DS-1 / IMPERIAL RESTRICTED</text>
</svg>
