<text x="60" y="648" class="small">Arrows show direction. Dashed = reverse-direction channel, not a shared session. Unlisted flows are blocked.</text><text x="60" y="689" class="stamp">DS1-DRG-106  /  REV 01  /  SCHEMATIC · NOT TO SCALE</text><text x="835" y="689" class="small">DS-1 / IMPERIAL RESTRICTED</text>
