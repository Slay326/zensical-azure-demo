<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">DS1-DRG-106 — Network enclaves / explicit interfaces</title><desc id="desc">Four trust enclaves align to physical zones. Adjacent gateways validate messages. Core setpoints and telemetry use separate one-way physical diode paths.</desc>
<defs><pattern id="fine" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#14222d" stroke-width=".5"/></pattern><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#fine)"/><path d="M50 0H0V50" fill="none" stroke="#223744" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a4c5d4" stroke-width="1.2"/></marker>
<style>text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#d5e5ec}.label{font-size:18px}.small{font-size:13px;fill:#96b2c1}.heading{font-size:27px;letter-spacing:1px}.stamp{font-size:14px;fill:#a4c5d4;letter-spacing:1px}.wire{fill:none;stroke:#a4c5d4;stroke-width:1.5}.signal{fill:none;stroke:#a4c5d4;stroke-width:1.4;stroke-dasharray:6 5}.boundary{fill:#0a141c;fill-opacity:.8;stroke:#597b8e;stroke-width:1.3;stroke-dasharray:7 5}.critical{fill:none;stroke:#d8976b;stroke-width:1.5}.node rect{fill:#101f2b;stroke:#799daf;stroke-width:1.2}.node.hot rect{stroke:#d8976b}.node.muted rect{stroke-dasharray:6 4}.coordinate{font-size:11px;fill:#6e8d9e}</style></defs>
<rect width="1200" height="720" fill="#09131c"/><rect x="18" y="18" width="1164" height="684" fill="url(#grid)" stroke="#466273"/>
<text x="100" y="32" class="coordinate">01</text><text x="300" y="32" class="coordinate">02</text><text x="500" y="32" class="coordinate">03</text><text x="700" y="32" class="coordinate">04</text><text x="900" y="32" class="coordinate">05</text><text x="1100" y="32" class="coordinate">06</text>
<text x="25" y="160" class="coordinate">A</text><text x="25" y="305" class="coordinate">B</text><text x="25" y="450" class="coordinate">C</text><text x="25" y="595" class="coordinate">D</text>
<rect x="40" y="45" width="1120" height="76" fill="#09131c"/>
<text x="60" y="72" class="stamp">IMPERIAL ENGINEERING DIRECTORATE / CONTROLLED DRAWING</text><text x="60" y="108" class="heading">NETWORK ENCLAVES / EXPLICIT INTERFACES</text>
<rect x="60" y="220" width="210" height="230" class="boundary"/><text x="78" y="250" class="stamp">ENC-LOG / Z4</text><text x="78" y="288" class="small">External interface</text><rect x="350" y="220" width="210" height="230" class="boundary"/><text x="368" y="250" class="stamp">ENC-OPS / Z3</text><text x="368" y="288" class="small">Habitation / work</text><rect x="640" y="220" width="210" height="230" class="boundary"/><text x="658" y="250" class="stamp">ENC-CTRL / Z1–2</text><text x="658" y="288" class="small">Command / plant</text><rect x="930" y="220" width="210" height="230" class="boundary"/><text x="948" y="250" class="stamp">ENC-CORE / Z0</text><text x="948" y="288" class="small">Containment</text><path d="M270 327H350" class="wire" marker-end="url(#arrow)"/><path d="M350 400H270" class="signal" marker-end="url(#arrow)"/><path d="M560 327H640" class="wire" marker-end="url(#arrow)"/><path d="M640 400H560" class="signal" marker-end="url(#arrow)"/><path d="M850 327H930" class="wire" marker-end="url(#arrow)"/><path d="M930 400H850" class="signal" marker-end="url(#arrow)"/><text x="274" y="316" class="small">GW-LO</text><text x="274" y="424" class="small">GW-OL</text><text x="564" y="316" class="small">GW-OC</text><text x="564" y="424" class="small">GW-CO</text><text x="844" y="316" class="small">D-IN</text><text x="844" y="424" class="small">D-OUT</text><g class="node "><rect x="60" y="490" width="490" height="76"/><text x="76" y="519" class="label" style="font-size:18px">EXTERNAL SESSIONS TERMINATE AT Z4</text><text x="76" y="545" class="small" style="font-size:13px">No transparent pass-through to interior enclaves</text></g><g class="node "><rect x="640" y="490" width="500" height="76"/><text x="656" y="519" class="label" style="font-size:18px">CORE DIODES ARE PHYSICALLY SEPARATE</text><text x="656" y="545" class="small" style="font-size:13px">Setpoints in; telemetry out; no request-response</text></g>
