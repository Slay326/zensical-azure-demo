<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">DS1-DRG-105 — Security zones / inward gates</title><desc id="desc">Five zones require four successive boundary decisions. Inward transit is checked at each gate. Z0 requires two independently authorized people.</desc>
<defs><pattern id="fine" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#14222d" stroke-width=".5"/></pattern><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#fine)"/><path d="M50 0H0V50" fill="none" stroke="#223744" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a4c5d4" stroke-width="1.2"/></marker>
<style>text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#d5e5ec}.label{font-size:18px}.small{font-size:13px;fill:#96b2c1}.heading{font-size:27px;letter-spacing:1px}.stamp{font-size:14px;fill:#a4c5d4;letter-spacing:1px}.wire{fill:none;stroke:#a4c5d4;stroke-width:1.5}.signal{fill:none;stroke:#a4c5d4;stroke-width:1.4;stroke-dasharray:6 5}.boundary{fill:#0a141c;fill-opacity:.8;stroke:#597b8e;stroke-width:1.3;stroke-dasharray:7 5}.critical{fill:none;stroke:#d8976b;stroke-width:1.5}.node rect{fill:#101f2b;stroke:#799daf;stroke-width:1.2}.node.hot rect{stroke:#d8976b}.node.muted rect{stroke-dasharray:6 4}.coordinate{font-size:11px;fill:#6e8d9e}</style></defs>
<rect width="1200" height="720" fill="#09131c"/><rect x="18" y="18" width="1164" height="684" fill="url(#grid)" stroke="#466273"/>
<text x="100" y="32" class="coordinate">01</text><text x="300" y="32" class="coordinate">02</text><text x="500" y="32" class="coordinate">03</text><text x="700" y="32" class="coordinate">04</text><text x="900" y="32" class="coordinate">05</text><text x="1100" y="32" class="coordinate">06</text>
<text x="25" y="160" class="coordinate">A</text><text x="25" y="305" class="coordinate">B</text><text x="25" y="450" class="coordinate">C</text><text x="25" y="595" class="coordinate">D</text>
<rect x="40" y="45" width="1120" height="76" fill="#09131c"/>
<text x="60" y="72" class="stamp">IMPERIAL ENGINEERING DIRECTORATE / CONTROLLED DRAWING</text><text x="60" y="108" class="heading">SECURITY ZONES / INWARD GATES</text>
<g class="node "><rect x="60" y="255" width="180" height="76"/><text x="76" y="284" class="label" style="font-size:18px">Z4</text><text x="76" y="310" class="small" style="font-size:13px">Perimeter</text></g><g class="node "><rect x="285" y="255" width="180" height="76"/><text x="301" y="284" class="label" style="font-size:18px">Z3</text><text x="301" y="310" class="small" style="font-size:13px">Habitation</text></g><g class="node "><rect x="510" y="255" width="180" height="76"/><text x="526" y="284" class="label" style="font-size:18px">Z2</text><text x="526" y="310" class="small" style="font-size:13px">Control</text></g><g class="node "><rect x="735" y="255" width="180" height="76"/><text x="751" y="284" class="label" style="font-size:18px">Z1</text><text x="751" y="310" class="small" style="font-size:13px">Plant</text></g><g class="node hot"><rect x="960" y="255" width="180" height="76"/><text x="976" y="284" class="label" style="font-size:18px">Z0</text><text x="976" y="310" class="small" style="font-size:13px">Containment</text></g><path d="M240 293H285" class="wire" marker-end="url(#arrow)"/><text x="150" y="375" class="small">BCP-4/3</text><path d="M465 293H510" class="wire" marker-end="url(#arrow)"/><text x="375" y="375" class="small">BCP-3/2</text><path d="M690 293H735" class="wire" marker-end="url(#arrow)"/><text x="600" y="375" class="small">BCP-2/1</text><path d="M915 293H960" class="wire" marker-end="url(#arrow)"/><text x="825" y="375" class="small">BCP-1/0</text><path d="M1050 450H150" class="wire" marker-end="url(#arrow)"/><text x="345" y="437" class="stamp">OUTWARD EGRESS / ONE-WAY / ALARMED</text><g class="node "><rect x="60" y="500" width="450" height="76"/><text x="76" y="529" class="label" style="font-size:18px">NORMAL INWARD TRANSIT</text><text x="76" y="555" class="small" style="font-size:13px">Identity + clearance + scope + current state</text></g><g class="node "><rect x="650" y="500" width="490" height="76"/><text x="666" y="529" class="label" style="font-size:18px">Z1 → Z0 / TWO-PERSON RULE</text><text x="666" y="555" class="small" style="font-size:13px">Independent decisions; neither authorizes the other</text></g><text x="60" y="191" class="stamp">INWARD / INCREASING CONTROL →</text>
<path d="M40 620H1160M40 667H1160M815 667V702" class="wire"/>
<text x="60" y="648" class="small">Zone depth is not clearance inheritance. Emergency egress never grants re-entry; use the normal BCP.</text><text x="60" y="689" class="stamp">DS1-DRG-105  /  REV 01  /  SCHEMATIC · NOT TO SCALE</text><text x="835" y="689" class="small">DS-1 / IMPERIAL RESTRICTED</text>
</svg>
