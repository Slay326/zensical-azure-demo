<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">DS1-DRG-110 — Emergency routing / local evacuation</title><desc id="desc">Conceptual routing after a local compartment incident. A blocked primary route is avoided using the walkway network to an available muster area. Zone egress remains outward-only.</desc>
<defs><pattern id="fine" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#14222d" stroke-width=".5"/></pattern><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#fine)"/><path d="M50 0H0V50" fill="none" stroke="#223744" stroke-width=".7"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#a4c5d4" stroke-width="1.2"/></marker>
<style>text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#d5e5ec}.label{font-size:18px}.small{font-size:13px;fill:#96b2c1}.heading{font-size:27px;letter-spacing:1px}.stamp{font-size:14px;fill:#a4c5d4;letter-spacing:1px}.wire{fill:none;stroke:#a4c5d4;stroke-width:1.5}.signal{fill:none;stroke:#a4c5d4;stroke-width:1.4;stroke-dasharray:6 5}.boundary{fill:#0a141c;fill-opacity:.8;stroke:#597b8e;stroke-width:1.3;stroke-dasharray:7 5}.critical{fill:none;stroke:#d8976b;stroke-width:1.5}.node rect{fill:#101f2b;stroke:#799daf;stroke-width:1.2}.node.hot rect{stroke:#d8976b}.node.muted rect{stroke-dasharray:6 4}.coordinate{font-size:11px;fill:#6e8d9e}</style></defs>
<rect width="1200" height="720" fill="#09131c"/><rect x="18" y="18" width="1164" height="684" fill="url(#grid)" stroke="#466273"/>
<text x="100" y="32" class="coordinate">01</text><text x="300" y="32" class="coordinate">02</text><text x="500" y="32" class="coordinate">03</text><text x="700" y="32" class="coordinate">04</text><text x="900" y="32" class="coordinate">05</text><text x="1100" y="32" class="coordinate">06</text>
<text x="25" y="160" class="coordinate">A</text><text x="25" y="305" class="coordinate">B</text><text x="25" y="450" class="coordinate">C</text><text x="25" y="595" class="coordinate">D</text>
<rect x="40" y="45" width="1120" height="76" fill="#09131c"/>
<text x="60" y="72" class="stamp">IMPERIAL ENGINEERING DIRECTORATE / CONTROLLED DRAWING</text><text x="60" y="108" class="heading">EMERGENCY ROUTING / LOCAL EVACUATION</text>
<rect x="65" y="160" width="1065" height="365" class="boundary"/><g class="node hot"><rect x="90" y="205" width="250" height="76"/><text x="106" y="234" class="label" style="font-size:18px">A / AFFECTED SECTOR</text><text x="106" y="260" class="small" style="font-size:13px">Alarm + local isolation</text></g><g class="node hot"><rect x="480" y="205" width="250" height="76"/><text x="496" y="234" class="label" style="font-size:18px">B / PRIMARY ROUTE</text><text x="496" y="260" class="small" style="font-size:13px">Blocked / do not enter</text></g><g class="node "><rect x="865" y="205" width="240" height="76"/><text x="881" y="234" class="label" style="font-size:18px">C / MUSTER</text><text x="881" y="260" class="small" style="font-size:13px">Available safe sector</text></g><path d="M340 243H430" class="wire"/><path d="M444 225L466 260M466 225L444 260" class="critical"/><path d="M215 281V450H985V281" class="wire" marker-end="url(#arrow)"/><text x="320" y="431" class="stamp">ALTERNATE WALKWAY / NO POWER DEPENDENCY</text><path d="M735 165V405" class="critical"/><text x="758" y="354" class="small">ISOLATED</text><text x="758" y="375" class="small">BOUNDARY</text><text x="90" y="565" class="stamp">MUSTER → ACCOUNTABILITY → MEDICAL / INCIDENT COMMAND</text><text x="90" y="597" class="small">Conceptual route only: actual access depends on local pressure and boundary state.</text>
<path d="M40 620H1160M40 667H1160M815 667V702" class="wire"/>
<text x="60" y="648" class="small">Arrows = alternate movement to safety. Outward zone egress is alarmed; re-entry uses normal authorization.</text><text x="60" y="689" class="stamp">DS1-DRG-110  /  REV 01  /  SCHEMATIC · NOT TO SCALE</text><text x="835" y="689" class="small">DS-1 / IMPERIAL RESTRICTED</text>
</svg>
