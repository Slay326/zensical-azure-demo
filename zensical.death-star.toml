# Applied to docs/death-star/ as a standalone site by scripts/build.py.
[project]
site_name = "DS-1 Orbital Battle Station"
site_url = "/death-star/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/stylesheets/directorate.css", "assets/stylesheets/blueprint.css"]

[project.theme]
language = "en"
palette.scheme = "slate"
features = [
  "navigation.indexes",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "content.code.copy",
  "search.highlight",
  "toc.follow",
]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
